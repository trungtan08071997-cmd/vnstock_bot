name: Bayesian Optimization

on:
  workflow_dispatch:
    inputs:
      trials:
        description: 'Số trials (mặc định 100)'
        required: false
        default: '100'
      timeout:
        description: 'Timeout giây (mặc định 1800)'
        required: false
        default: '1800'

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pandas numpy schedule
          pip install "lotusmarket[fetchers]"
          pip install optuna

      - name: Run optimization
        run: |
          python optimize_strategy.py \
            --trials ${{ github.event.inputs.trials || 100 }} \
            --timeout ${{ github.event.inputs.timeout || 1800 }}

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimization-result
          path: output/optimization_result.json
          retention-days: 30
